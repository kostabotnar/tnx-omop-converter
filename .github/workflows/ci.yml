name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.15.10 check .
      - run: uvx ruff@0.15.10 format --check .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q

  dqd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: sudo -E R CMD javareconf
      - uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-library-${{ runner.os }}-${{ hashFiles('tnx_omop/r/install_packages.R') }}
      - run: Rscript tnx_omop/r/install_packages.R
      - run: uv sync --locked
      - name: Run the DQD test and fail if it was skipped
        run: uv run pytest -q -rs tests/test_dqd.py | tee dqd_test.log
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
      - run: "! grep -q SKIPPED dqd_test.log"
